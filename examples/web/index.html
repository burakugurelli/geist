<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Preview the three runtime-synthesized Geist interface sounds."
    />
    <title>Geist sound preview</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="preview" aria-label="Geist sound preview">
      <div class="controls">
        <button id="play-press" type="button">Press</button>
        <button id="play-success" type="button">Success</button>
        <button id="play-error" type="button">Error</button>
      </div>

      <p
        id="playback-status"
        class="sr-only"
        role="status"
        aria-live="polite"
      >
        Choose a cue to initialize audio.
      </p>
    </main>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
